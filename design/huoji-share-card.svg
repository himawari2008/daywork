<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="活记 分享卡片">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="1" stop-color="#E8815C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="640" fill="url(#sg)"/>
  <rect width="800" height="240" fill="#ffffff" opacity="0.06"/>
  <!-- 品牌标记：白色日记卡 + 声波 -->
  <g transform="translate(72 80)">
    <rect x="0" y="0" width="84" height="104" rx="16" fill="#ffffff"/>
    <rect x="16" y="40" width="9" height="36" rx="4.5" fill="#E8815C"/>
    <rect x="31" y="28" width="9" height="60" rx="4.5" fill="#E8815C"/>
    <rect x="46" y="36" width="9" height="44" rx="4.5" fill="#E8815C"/>
    <rect x="61" y="30" width="9" height="56" rx="4.5" fill="#E8815C"/>
    <path d="M104 14 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#ffffff"/>
  </g>
  <!-- 主标题 -->
  <text x="72" y="372" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="120" font-weight="800" fill="#ffffff">活记</text>
  <!-- 口号 -->
  <text x="76" y="438" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="600" fill="#ffffff" opacity="0.96">用声音，记下每一天</text>
  <!-- 副标题 -->
  <text x="76" y="492" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#ffffff" opacity="0.82">个人 AI 语音工作日记</text>
  <!-- 右側声波装饰 -->
  <g transform="translate(600 360)" fill="#ffffff" opacity="0.9">
    <rect x="0" y="-30" width="14" height="60" rx="7"/>
    <rect x="22" y="-52" width="14" height="104" rx="7"/>
    <rect x="44" y="-40" width="14" height="80" rx="7"/>
    <rect x="66" y="-60" width="14" height="120" rx="7"/>
    <rect x="88" y="-24" width="14" height="48" rx="7"/>
  </g>
</svg>
